name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Africa/Cairo]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smarthabbit
          POSTGRES_PASSWORD: smarthabbit
          POSTGRES_DB: smarthabbit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smarthabbit -d smarthabbit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TZ: ${{ matrix.tz }}
      DB_HOST: localhost
      DB_USER: smarthabbit
      DB_PASSWORD: smarthabbit
      DB_NAME: smarthabbit_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
